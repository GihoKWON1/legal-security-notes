services:
  vulnerable:
    build:
      context: .
      dockerfile: vulnerable/Dockerfile
      args:
        # Eclipse Temurin JDK 17 마지막 패치 이전 빌드(17.0.21+9, 2026-10-22 공개).
        # 출처: fenko.nz 패치 현황 추적표(2026-11-18 조회) — README.md '버전 지정' 참고.
        # Docker Hub에 해당 태그가 실제로 존재하는지는 빌드 전에 다시 확인할 것.
        JDK_TAG: "17.0.21_9"
    image: java4shell-lab:vulnerable

  patched:
    build:
      context: .
      dockerfile: patched/Dockerfile
      args:
        # Eclipse Temurin JDK 17 패치 빌드(17.0.21.1+2).
        # 출처: adoptium.net 공식 가이드(2026-11-18 조회) — README.md '버전 지정' 참고.
        # 공지 자체가 "배포 진행 중"이라고 명시하므로, Docker Hub에 이 태그가
        # 이미 올라와 있는지는 빌드 전에 다시 확인할 것(없으면 빌드가 실패한다).
        JDK_TAG: "17.0.21.1_2"
    image: java4shell-lab:patched
